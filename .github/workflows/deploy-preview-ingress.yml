name: Deploy Shared ALOHA Preview Ingress

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Confirm staging-only ingress deploy (no public route)"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: aloha-preview-ingress
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirmation == 'DEPLOY_ALOHA_PREVIEW_INGRESS'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@10.9.2
      - run: npm install --legacy-peer-deps
      - name: Verify shared ingress and Health auth adapter
        run: |
          npm run typecheck -w @aloha/preview-ingress
          npm run test -w @aloha/preview-ingress
          npm run test -w @aloha/health
      - name: Verify no public route or credentials in committed configuration
        run: |
          node -e "const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('workers/preview-ingress/wrangler.jsonc'));if(c.workers_dev!==false||c.routes||c.route||c.vars||c.name!=='aloha-preview-ingress'||!c.compatibility_flags?.includes('global_fetch_strictly_public'))process.exit(1)"
      - name: Dry-run Worker bundle
        working-directory: workers/preview-ingress
        run: npx wrangler deploy --dry-run --outdir ../../.preview-ingress-dry-run
      - name: Deploy staging ingress Worker without a public route
        working-directory: workers/preview-ingress
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
