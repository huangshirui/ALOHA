name: Deploy ALOHA Health (Preview or Production)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Choose Health Staging Preview or independent Production deployment"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: aloha-health-staging-preview
  cancel-in-progress: false

jobs:
  deploy-health:
    name: Verify and deploy Health staging Preview
    if: inputs.confirmation == 'DEPLOY_ALOHA_HEALTH_STAGING_PREVIEW'
    runs-on: ubuntu-latest
    environment: preview
    env:
      WRANGLER_LOG: error
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Use repository npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Assert this ref contains the reviewed Health BFF
        run: |
          test -f apps/health/src/worker.ts
          node -e "const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('apps/health/wrangler.jsonc'));if(c.name!=='aloha-app-health'||c.main!=='./src/worker.ts'||!c.previews?.durable_objects?.bindings?.some(b=>b.name==='HEALTH_PRESENTATION'))process.exit(1)"

      - name: Verify Health
        run: npm run typecheck -w @aloha/health && npm run test -w @aloha/health

      - name: Build staging Health
        env:
          VITE_HEALTH_DATA_MODE: live
          VITE_ALOHA_SETTINGS_URL: ${{ vars.ALOHA_SETTINGS_STAGING_URL }}
        run: npm run build:health

      - name: Verify Worker bundle compiles without deploying
        working-directory: apps/health
        run: npx wrangler deploy --dry-run --outdir ../../.health-preview-dry-run

      - name: Deploy named staging Preview (does not modify Production)
        working-directory: apps/health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler preview --name staging

      - name: Verify deployed Preview bindings (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const root = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/workers/aloha-app-health/previews`;
          const read = async (path) => {
            const response = await fetch(root + path, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
            });
            const payload = await response.json();
            if (!response.ok || !payload.success) throw new Error('Cannot verify Cloudflare Preview deployment metadata');
            return payload.result;
          };
          const preview = (await read('?name=staging')).find((item) => item.name === 'staging');
          if (!preview) throw new Error('Named staging Preview was not found');
          const deployments = await read(`/${preview.id}/deployments`);
          if (!deployments.length) throw new Error('Named staging Preview has no deployments');
          const latest = await read(`/${preview.id}/deployments/${deployments[0].id}`);
          const required = [
            'ASSETS', 'HEALTH_PRESENTATION', 'LIFESPACE_APPLICATION_CREDENTIAL',
            'LIFESPACE_IDENTITY_BASE_URL', 'LIFESPACE_CORE_BASE_URL',
          ];
          const missing = required.filter((name) => !(name in (latest.env ?? {})));
          if (missing.length) {
            throw new Error(`Missing staging Preview bindings: ${missing.join(', ')}. Reconfigure in Cloudflare Dashboard before using live Health data.`);
          }
          console.log('Health staging Preview required bindings present (names only; values not read).');
          NODE

      - name: Reminder
        run: |
          echo "The named staging Preview is separate from the Health Worker Production deployment."
          echo "Configure Preview-scoped secrets and protect its hostname with Cloudflare Access."

  production:
    name: Verify and deploy only ALOHA Health
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_ALOHA_HEALTH_PRODUCTION'
    runs-on: ubuntu-latest
    environment: production
    env:
      WRANGLER_LOG: error
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm install --global npm@10.9.2
      - run: npm install --legacy-peer-deps

      - name: Verify Health workspace
        run: npm run typecheck -w @aloha/health && npm run test -w @aloha/health

      - name: Verify only Health Production bindings (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account } = process.env
          if (!token || !account) throw new Error('Production Cloudflare credentials unavailable')
          const worker = 'aloha-app-health'
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}/secrets`
          const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } })
          const payload = await response.json()
          if (!response.ok || !payload.success || !Array.isArray(payload.result))
            throw new Error('Cannot verify Health Production bindings')
          const names = new Set(payload.result.map(item => item.name))
          const required = ['LIFESPACE_APPLICATION_CREDENTIAL', 'LIFESPACE_IDENTITY_BASE_URL', 'LIFESPACE_CORE_BASE_URL']
          const missing = required.filter(name => !names.has(name))
          if (missing.length) throw new Error('Missing Health Production bindings: ' + missing.join(', '))
          console.log('Health Production bindings verified by name only')
          NODE

      - name: Verify Health configuration cannot activate a public route
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const config = JSON.parse(fs.readFileSync('apps/health/wrangler.jsonc','utf8'))
          if (config.name !== 'aloha-app-health' || config.workers_dev !== false ||
              config.route || config.routes || config.vars || config.keep_vars !== true ||
              config.main !== './src/worker.ts')
            throw new Error('Unsafe Health Production Worker configuration')
          NODE

      - name: Build only Health for Production
        env:
          VITE_HEALTH_DATA_MODE: live
        run: npm run build:health

      - name: Dry-run only Health Worker
        working-directory: apps/health
        run: npx wrangler deploy --dry-run --outdir ../../.health-production-dry-run

      - name: Deploy only Health Production Worker
        working-directory: apps/health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Report release boundary
        run: |
          echo "Health Production Worker deployed independently."
          echo "No Assistant, Gateway, other PWA or Settings/Health peer was deployed."
          echo "Public hostname route activation requires a separate review."
