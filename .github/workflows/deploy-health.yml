name: Deploy Health PWA Preview

on:
  workflow_dispatch:
    inputs:
      data_mode:
        description: "Health mode (live requires Staging LifeSpace models and Access; DO is provisioned by Wrangler)"
        type: choice
        required: true
        default: demo
        options:
          - demo
          - live

permissions:
  contents: read
  deployments: write

concurrency:
  group: aloha-health-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-health:
    name: Verify and deploy Health preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use repository npm version
        run: npm install --global npm@10.9.2

      # The repository has no lockfile yet. Keep this aligned with the main CI
      # until the repository switches to npm ci.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck Health
        run: npm run typecheck -w @aloha/health

      - name: Build Health
        env:
          VITE_HEALTH_DATA_MODE: ${{ inputs.data_mode }}
        run: npm run build:health

      - name: Deploy Health Worker preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/health
          command: deploy

      - name: Production-route note
        run: |
          echo "Health is deployed only to its Worker preview endpoint."
          echo "The aloha.aisr.online/health/* production route is intentionally not activated yet."
