name: Deploy Health PWA Staging Preview

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Confirm staging Preview deploy (never Production)"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: aloha-health-staging-preview
  cancel-in-progress: false

jobs:
  deploy-health:
    name: Verify and deploy Health staging Preview
    if: inputs.confirmation == 'DEPLOY_ALOHA_HEALTH_STAGING_PREVIEW'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use repository npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify Health
        run: npm run typecheck -w @aloha/health && npm run test -w @aloha/health

      - name: Build staging Health
        env:
          VITE_HEALTH_DATA_MODE: live
        run: npm run build:health

      - name: Deploy named staging Preview (does not modify Production)
        working-directory: apps/health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.135.0 preview --name staging

      - name: Reminder
        run: |
          echo "The named staging Preview is separate from the Health Worker Production deployment."
          echo "Configure Preview-scoped secrets and protect its hostname with Cloudflare Access."
