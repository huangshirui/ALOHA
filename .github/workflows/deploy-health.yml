name: Deploy Health PWA Preview and Runtime Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Health staging Preview or one-time production runtime bootstrap (use the exact confirmation word)"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: aloha-health-staging-preview
  cancel-in-progress: false

jobs:
  deploy-health:
    name: Verify and deploy Health staging Preview
    if: inputs.confirmation == 'DEPLOY_ALOHA_HEALTH_STAGING_PREVIEW'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use repository npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Assert this ref contains the reviewed Health BFF
        run: |
          test -f apps/health/src/worker.ts
          node -e "const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('apps/health/wrangler.jsonc'));if(c.name!=='aloha-app-health'||c.main!=='./src/worker.ts'||!c.previews?.durable_objects?.bindings?.some(b=>b.name==='HEALTH_PRESENTATION'))process.exit(1)"

      - name: Verify Health
        run: npm run typecheck -w @aloha/health && npm run test -w @aloha/health

      - name: Build staging Health
        env:
          VITE_HEALTH_DATA_MODE: live
        run: npm run build:health

      - name: Verify Worker bundle compiles without deploying
        working-directory: apps/health
        run: npx wrangler deploy --dry-run --outdir ../../.health-preview-dry-run

      - name: Deploy named staging Preview (does not modify Production)
        working-directory: apps/health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler preview --name staging

      - name: Verify deployed Preview bindings (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const root = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/workers/aloha-app-health/previews`;
          const read = async (path) => {
            const response = await fetch(root + path, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
            });
            const payload = await response.json();
            if (!response.ok || !payload.success) throw new Error('Cannot verify Cloudflare Preview deployment metadata');
            return payload.result;
          };
          const preview = (await read('?name=staging')).find((item) => item.name === 'staging');
          if (!preview) throw new Error('Named staging Preview was not found');
          const deployments = await read(`/${preview.id}/deployments`);
          if (!deployments.length) throw new Error('Named staging Preview has no deployments');
          const latest = await read(`/${preview.id}/deployments/${deployments[0].id}`);
          const required = [
            'ASSETS', 'HEALTH_PRESENTATION', 'LIFESPACE_APPLICATION_CREDENTIAL',
            'LIFESPACE_IDENTITY_BASE_URL', 'LIFESPACE_CORE_BASE_URL',
          ];
          const missing = required.filter((name) => !(name in (latest.env ?? {})));
          if (missing.length) {
            throw new Error(`Missing staging Preview bindings: ${missing.join(', ')}. Reconfigure in Cloudflare Dashboard before using live Health data.`);
          }
          console.log('Health staging Preview required bindings present (names only; values not read).');
          NODE

      - name: Reminder
        run: |
          echo "The named staging Preview is separate from the Health Worker Production deployment."
          echo "Configure Preview-scoped secrets and protect its hostname with Cloudflare Access."

  bootstrap-production-runtime:
    name: One-time production runtime bootstrap (no public routes)
    if: inputs.confirmation == 'BOOTSTRAP_ALOHA_HEALTH_PRODUCTION_RUNTIME'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use repository npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Fail closed if this would publish a production URL
        run: |
          test -f apps/health/src/worker.ts
          node -e "const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('apps/health/wrangler.jsonc'));if(c.name!=='aloha-app-health'||c.main!=='./src/worker.ts'||c.workers_dev!==false||c.route||c.routes||c.vars||!c.preview_urls||!c.previews?.durable_objects?.bindings?.some(b=>b.name==='HEALTH_PRESENTATION'))process.exit(1)"

      - name: Verify Health
        run: npm run typecheck -w @aloha/health && npm run test -w @aloha/health

      - name: Build Health runtime assets
        run: npm run build:health

      - name: Dry-run production Worker bundle
        working-directory: apps/health
        run: npx wrangler deploy --dry-run --outdir ../../.health-bootstrap-dry-run

      - name: Bootstrap runtime on production Worker (not a public launch)
        working-directory: apps/health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deployment boundary
        run: |
          echo "Production Worker script updated, without workers.dev or route activation."
          echo "No backend credentials have been installed on Production."
          echo "Configure preview secrets using the Cloudflare Dashboard; do not copy production settings."
