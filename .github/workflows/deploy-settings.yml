name: Deploy ALOHA Settings (Staging or Production)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Choose a reviewed Staging or Production deployment confirmation"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: aloha-settings-release
  cancel-in-progress: false

jobs:
  deploy-settings:
    name: Verify and deploy Settings staging environment
    if: inputs.confirmation == 'DEPLOY_ALOHA_SETTINGS_STAGING'
    runs-on: ubuntu-latest
    environment: preview
    env:
      WRANGLER_LOG: error
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Verify Settings UI and BFF
        run: npm run typecheck -w @aloha/settings && npm run test -w @aloha/settings
      - name: Build /settings/ assets
        env:
          VITE_ALOHA_HEALTH_URL: ${{ vars.ALOHA_HEALTH_STAGING_URL }}
        run: npm run build -w @aloha/settings
      - name: Require isolated Settings staging configuration
        run: npm run verify:release-isolation
      - name: Dry-run Settings Worker
        working-directory: apps/settings
        run: npx wrangler deploy --env staging --dry-run --outdir ../../.settings-staging-dry-run
      - name: Deploy only Settings staging environment (no Production change)
        working-directory: apps/settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      - name: Verify only Settings Staging bindings (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account } = process.env
          if (!token || !account) throw new Error('Staging Cloudflare credentials unavailable')
          const worker = 'aloha-app-settings-staging'
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}/secrets`
          const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } })
          const payload = await response.json()
          if (!response.ok || !payload.success || !Array.isArray(payload.result))
            throw new Error('Cannot verify Settings Staging bindings')
          const names = new Set(payload.result.map(item => item.name))
          const required = ['LIFESPACE_APPLICATION_CREDENTIAL', 'LIFESPACE_IDENTITY_BASE_URL', 'LIFESPACE_CORE_BASE_URL']
          const missing = required.filter(name => !names.has(name))
          if (missing.length) throw new Error('Missing Settings Staging bindings: ' + missing.join(', '))
          console.log('Settings Staging bindings verified by name only')
          NODE


  production:
    name: Verify and deploy only ALOHA Settings
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_ALOHA_SETTINGS_PRODUCTION'
    runs-on: ubuntu-latest
    environment: production
    env:
      WRANGLER_LOG: error
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@10.9.2
      - run: npm install --legacy-peer-deps

      - name: Verify Settings workspace
        run: npm run typecheck -w @aloha/settings && npm run test -w @aloha/settings

      - name: Verify only Settings Production bindings (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account } = process.env
          if (!token || !account) throw new Error('Production Cloudflare credentials unavailable')
          const worker = 'aloha-app-settings'
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}/secrets`
          const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } })
          const payload = await response.json()
          if (!response.ok || !payload.success || !Array.isArray(payload.result))
            throw new Error('Cannot verify Settings Production bindings')
          const names = new Set(payload.result.map(item => item.name))
          const required = ['LIFESPACE_APPLICATION_CREDENTIAL', 'LIFESPACE_IDENTITY_BASE_URL', 'LIFESPACE_CORE_BASE_URL']
          const missing = required.filter(name => !names.has(name))
          if (missing.length) throw new Error('Missing Settings Production bindings: ' + missing.join(', '))
          console.log('Settings Production bindings verified by name only')
          NODE

      - name: Verify Settings configuration cannot activate a public route
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const config = JSON.parse(fs.readFileSync('apps/settings/wrangler.jsonc','utf8'))
          if (config.name !== 'aloha-app-settings' || config.workers_dev !== false ||
              config.route || config.routes || config.vars || config.keep_vars !== true ||
              config.main !== './src/entrypoint.ts')
            throw new Error('Unsafe Settings Production Worker configuration')
          NODE

      - name: Build only Settings for Production
        run: npm run build -w @aloha/settings

      - name: Dry-run only Settings Worker
        working-directory: apps/settings
        run: npx wrangler deploy --dry-run --outdir ../../.settings-production-dry-run

      - name: Deploy only Settings Production Worker
        working-directory: apps/settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Report release boundary
        run: |
          echo "Settings Production Worker deployed independently."
          echo "No Assistant, Gateway, other PWA or Settings/Health peer was deployed."
          echo "Public hostname route activation requires a separate review."
