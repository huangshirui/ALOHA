name: Deploy shared ALOHA Settings Preview

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Staging Preview or one-time no-route bootstrap (exact confirmation)"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: aloha-settings-preview
  cancel-in-progress: false

jobs:
  deploy-settings:
    name: Verify and deploy Settings staging Preview
    if: inputs.confirmation == 'DEPLOY_ALOHA_SETTINGS_STAGING_PREVIEW'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Verify Settings UI and BFF
        run: npm run typecheck -w @aloha/settings && npm run test -w @aloha/settings
      - name: Build /settings/ assets
        env:
          VITE_ALOHA_HEALTH_URL: ${{ vars.ALOHA_HEALTH_STAGING_URL }}
        run: npm run build -w @aloha/settings
      - name: Dry-run Settings Worker
        working-directory: apps/settings
        run: npx wrangler deploy --dry-run --outdir ../../.settings-preview-dry-run
      - name: Deploy named staging Preview (no Production change)
        working-directory: apps/settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler preview --name staging
      - name: Verify staged binding presence (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/workers/aloha-app-settings/previews`;
          async function read(path) {
            const response = await fetch(base+path,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}})
            const json = await response.json()
            if(!response.ok||!json.success) throw new Error('Settings staging Preview inspection failed')
            return json.result
          }
          const preview = (await read('?name=staging')).find(x=>x.name==='staging')
          if(!preview)throw new Error('Settings staging Preview not found')
          const deployments = await read(`/${preview.id}/deployments`)
          if(!deployments.length)throw new Error('Settings staging deployment not found')
          const latest = await read(`/${preview.id}/deployments/${deployments[0].id}`)
          const required=['ASSETS','LIFESPACE_APPLICATION_CREDENTIAL','LIFESPACE_IDENTITY_BASE_URL','LIFESPACE_CORE_BASE_URL']
          const missing=required.filter(x=>!(x in (latest.env||{})))
          if(missing.length)throw new Error('Missing Settings Preview bindings: '+missing.join(', '))
          console.log('Settings staging required binding names verified; no values printed')
          NODE

  bootstrap-runtime:
    name: One-time no-public-route Settings Worker bootstrap
    if: inputs.confirmation == 'BOOTSTRAP_ALOHA_SETTINGS_PRODUCTION_RUNTIME'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@10.9.2
      - run: npm install --legacy-peer-deps
      - name: Fail closed if this could expose Production
        run: |
          node - <<'NODE'
          const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('apps/settings/wrangler.jsonc','utf8'))
          if(c.name!=='aloha-app-settings'||c.workers_dev!==false||!c.preview_urls||c.route||c.routes||c.vars||c.main!=='./src/worker.ts')process.exit(1)
          NODE
      - run: npm run typecheck -w @aloha/settings && npm run test -w @aloha/settings && npm run build -w @aloha/settings
      - name: Dry-run no-route Worker
        working-directory: apps/settings
        run: npx wrangler deploy --dry-run --outdir ../../.settings-runtime-dry-run
      - name: One-time Worker runtime bootstrap (no public URL/route)
        working-directory: apps/settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
