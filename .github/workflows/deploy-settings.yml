name: Deploy ALOHA Settings (Preview or Production)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Choose a reviewed Preview or Production deployment confirmation"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: aloha-settings-preview
  cancel-in-progress: false

jobs:
  deploy-settings:
    name: Verify and deploy Settings staging Preview
    if: inputs.confirmation == 'DEPLOY_ALOHA_SETTINGS_STAGING_PREVIEW'
    runs-on: ubuntu-latest
    environment: preview
    env:
      WRANGLER_LOG: error
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Verify Settings UI and BFF
        run: npm run typecheck -w @aloha/settings && npm run test -w @aloha/settings
      - name: Build /settings/ assets
        env:
          VITE_ALOHA_HEALTH_URL: ${{ vars.ALOHA_HEALTH_STAGING_URL }}
        run: npm run build -w @aloha/settings
      - name: Dry-run Settings Worker
        working-directory: apps/settings
        run: npx wrangler deploy --dry-run --outdir ../../.settings-preview-dry-run
      - name: Deploy named staging Preview (no Production change)
        working-directory: apps/settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler preview --name staging
      - name: Verify staged binding presence (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/workers/aloha-app-settings/previews`;
          async function read(path) {
            const response = await fetch(base+path,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}})
            const json = await response.json()
            if(!response.ok||!json.success) throw new Error('Settings staging Preview inspection failed')
            return json.result
          }
          const preview = (await read('?name=staging')).find(x=>x.name==='staging')
          if(!preview)throw new Error('Settings staging Preview not found')
          const deployments = await read(`/${preview.id}/deployments`)
          if(!deployments.length)throw new Error('Settings staging deployment not found')
          const latest = await read(`/${preview.id}/deployments/${deployments[0].id}`)
          const required=['ASSETS','LIFESPACE_APPLICATION_CREDENTIAL','LIFESPACE_IDENTITY_BASE_URL','LIFESPACE_CORE_BASE_URL']
          const missing=required.filter(x=>!(x in (latest.env||{})))
          if(missing.length)throw new Error('Missing Settings Preview bindings: '+missing.join(', '))
          console.log('Settings staging required binding names verified; no values printed')
          NODE

  production:
    name: Verify and deploy only ALOHA Settings
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_ALOHA_SETTINGS_PRODUCTION'
    runs-on: ubuntu-latest
    environment: production
    env:
      WRANGLER_LOG: error
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --global npm@10.9.2
      - run: npm install --legacy-peer-deps

      - name: Verify Settings workspace
        run: npm run typecheck -w @aloha/settings && npm run test -w @aloha/settings

      - name: Verify only Settings Production bindings (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account } = process.env
          if (!token || !account) throw new Error('Production Cloudflare credentials unavailable')
          const worker = 'aloha-app-settings'
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}/secrets`
          const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } })
          const payload = await response.json()
          if (!response.ok || !payload.success || !Array.isArray(payload.result))
            throw new Error('Cannot verify Settings Production bindings')
          const names = new Set(payload.result.map(item => item.name))
          const required = ['LIFESPACE_APPLICATION_CREDENTIAL', 'LIFESPACE_IDENTITY_BASE_URL', 'LIFESPACE_CORE_BASE_URL']
          const missing = required.filter(name => !names.has(name))
          if (missing.length) throw new Error('Missing Settings Production bindings: ' + missing.join(', '))
          console.log('Settings Production bindings verified by name only')
          NODE

      - name: Verify Settings configuration cannot activate a public route
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const config = JSON.parse(fs.readFileSync('apps/settings/wrangler.jsonc','utf8'))
          if (config.name !== 'aloha-app-settings' || config.workers_dev !== false ||
              config.route || config.routes || config.vars || config.keep_vars !== true ||
              config.main !== './src/worker.ts')
            throw new Error('Unsafe Settings Production Worker configuration')
          NODE

      - name: Build only Settings for Production
        run: npm run build -w @aloha/settings

      - name: Dry-run only Settings Worker
        working-directory: apps/settings
        run: npx wrangler deploy --dry-run --outdir ../../.settings-production-dry-run

      - name: Deploy only Settings Production Worker
        working-directory: apps/settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Report release boundary
        run: |
          echo "Settings Production Worker deployed independently."
          echo "No Assistant, Gateway, other PWA or Settings/Health peer was deployed."
          echo "Public hostname route activation requires a separate review."
