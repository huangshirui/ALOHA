name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      WRANGLER_LOG: error
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      # The repository has no lockfile yet. --legacy-peer-deps avoids the current
      # npm Arborist peer-set crash; remove it when switching to npm ci.
      - run: npm install --legacy-peer-deps
      - run: npm run check
      - name: Dry-run package Health Worker (when runtime exists)
        run: |
          if [ -f apps/health/src/worker.ts ]; then
            cd apps/health
            npx wrangler deploy --dry-run --outdir ../../.health-preview-dry-run
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # A public-release gate must inspect history, not only the current tree.
          fetch-depth: 0
      - name: Scan full Git history for secrets
        # Pin the multi-arch image digest. v8.30.1 is intentionally avoided because
        # of a reported detection regression; revisit the pin after the regression is resolved.
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a
          git --redact --no-banner /repo
