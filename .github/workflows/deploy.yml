name: Deploy ALOHA Assistant (Gateway and Agent Control)

on:
  # The transitional Assistant/Gateway deployment is the only auto-released
  # surface. Shared packages and other apps never trigger it implicitly.
  push:
    branches: [main]
    paths:
      - 'apps/assistant/**'
      - 'workers/gateway/**'
      - 'workers/agent-control/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: aloha-assistant-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy only Assistant / Gateway / Agent Control
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      WRANGLER_LOG: error
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@10.9.2
      - run: npm install --legacy-peer-deps

      - name: Verify repository and Assistant deployment dependencies
        run: npm run check

      - name: Verify existing Production Worker and required secrets (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account } = process.env
          if (!token || !account) throw new Error('Cloudflare Production credentials unavailable')
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}`
          const headers = { Authorization: `Bearer ${token}` }
          const worker = await fetch(base + '/workers/workers/aloha-edge', { headers })
          if (!worker.ok) throw new Error('Existing Assistant Gateway Worker is missing; refuse migration or automatic creation')
          const response = await fetch(base + '/workers/scripts/aloha-agent-control/secrets', { headers })
          if (!response.ok) throw new Error('Cannot inspect Assistant Production secret bindings')
          const payload = await response.json()
          if (!payload.success || !Array.isArray(payload.result))
            throw new Error('Unexpected Assistant Production binding response')
          const names = new Set(payload.result.map(item => item.name))
          const required = [
            'N8N_AGENT_WEBHOOK_URL', 'N8N_AGENT_AUTH_TOKEN',
            'CAPABILITY_GRANT_SIGNING_KEY',
            'LIFESPACE_IDENTITY_BASE_URL', 'LIFESPACE_APPLICATION_CREDENTIAL',
          ]
          const missing = required.filter(name => !names.has(name))
          if (missing.length) throw new Error('Missing Assistant Production bindings: ' + missing.join(', '))
          console.log('Assistant Production Worker and required binding names verified')
          NODE

      - name: Build only Assistant static assets
        run: npm run build:assistant

      - name: Dry-run Agent Control
        working-directory: workers/agent-control
        run: npx wrangler deploy --dry-run --outdir ../../.agent-control-production-dry-run

      - name: Dry-run Assistant Gateway
        working-directory: workers/gateway
        run: npx wrangler deploy --dry-run --outdir ../../.assistant-gateway-production-dry-run

      - name: Deploy Agent Control
        working-directory: workers/agent-control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deploy Assistant Gateway with Assistant static assets
        working-directory: workers/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Release boundary
        run: |
          echo "Assistant and its existing Gateway/Agent Control published."
          echo "No Health, Settings, Finance or Things release performed."
