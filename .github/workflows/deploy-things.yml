name: Deploy Things PWA Staging Preview

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Confirm staging Preview deploy (never Production)"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: aloha-things-staging-preview
  cancel-in-progress: false

jobs:
  deploy-things:
    name: Verify and deploy Things staging Preview
    if: inputs.confirmation == 'DEPLOY_ALOHA_THINGS_STAGING_PREVIEW'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck Things
        run: npm run typecheck -w @aloha/things
      - name: Build Things
        run: npm run build:things
      - name: Deploy named staging Preview (not Production)
        working-directory: apps/things
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.135.0 preview --name staging
