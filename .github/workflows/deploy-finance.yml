name: Deploy Finance PWA Staging Preview

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Confirm staging Preview deploy (never Production)"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: aloha-finance-staging-preview
  cancel-in-progress: false

jobs:
  deploy-finance:
    name: Verify and deploy Finance staging Preview
    if: inputs.confirmation == 'DEPLOY_ALOHA_FINANCE_STAGING_PREVIEW'
    runs-on: ubuntu-latest
    environment: preview
    env:
      WRANGLER_LOG: error
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck Finance
        run: npm run typecheck -w @aloha/finance
      - name: Build Finance
        run: npm run build:finance
      - name: Deploy named staging Preview (not Production)
        working-directory: apps/finance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.135.0 preview --name staging
