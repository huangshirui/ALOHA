      C88 334 96 331 99 325
      C102 318 100 308 101 297
      C101 286 108 267 114 248
      C120 225 125 208 124 191
      C124 185 123 181 122 175"/>
    <!-- Right neck, shoulder, outer arm, hand and return to armpit -->
    <path d="M184 114
      C184 124 185 130 196 134
      C207 139 224 141 230 149
      C235 156 236 174 237 191
      C237 214 243 232 245 248
      C247 268 248 280 250 287
      C252 293 258 298 262 301
      C267 304 266 309 263 310
      C259 311 256 306 252 304
      C257 313 259 323 256 328
      C252 334 244 331 241 325
      C238 318 240 308 239 297
      C239 286 232 267 226 248
      C220 225 215 208 216 191
      C216 185 217 181 218 175"/>
    <!-- Torso to hips and legs, two separate continuous edges:
         no mirrored / scaled path transformation to distort limb proportions. -->
    <path d="M122 175
      C128 205 124 228 122 247
      C118 280 119 312 124 340
      C130 363 129 379 126 397
      C123 416 126 440 127 456
      C128 468 126 479 119 487
      C115 491 115 497 119 500
      L147 500
      C152 497 153 492 151 486
      C149 477 151 464 153 451
      C155 433 159 412 160 400
