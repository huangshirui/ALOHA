<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 520" fill="none" aria-labelledby="title" role="img">
  <title id="title">正面无性别人体线框</title>
  <!-- Front body reference aspect ratio: one intact viewBox, never scaled non-uniformly.
       The subtle grid can be removed without changing the body coordinate space. -->
  <g stroke="#D8E0E7" stroke-width=".65" opacity=".45">
    <path d="M0 60H340 M0 122H340 M0 184H340 M0 246H340 M0 308H340 M0 370H340 M0 432H340 M0 494H340"/>
    <path d="M17 42V503 M68 42V503 M119 42V503 M170 42V503 M221 42V503 M272 42V503 M323 42V503"/>
  </g>
  <g stroke="#112F4B" stroke-width="2.65" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- The user-supplied outline is the proportion reference: long narrow trunk,
         smooth rounded shoulders, relaxed arms, no sex characteristics. -->
    <ellipse cx="170" cy="87" rx="24.5" ry="34"/>
    <!-- Left neck, shoulder, outer arm, hand and return to armpit -->
    <path d="M156 114
      C156 124 155 130 144 134
      C133 139 116 141 110 149
      C105 156 104 174 103 191
      C103 214 97 232 95 248
      C93 268 92 280 90 287
      C88 293 82 298 78 301
