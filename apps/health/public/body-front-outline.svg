      C162 345 167 325 168 301"/>
    <path d="M218 175
      C212 205 216 228 218 247
      C222 280 221 312 216 340
      C210 363 211 379 214 397
      C217 416 214 440 213 456
      C212 468 214 479 221 487
      C225 491 225 497 221 500
      L193 500
      C188 497 187 492 189 486
      C191 477 189 464 187 451
      C185 433 181 412 180 400
      C179 387 181 378 180 363
      C178 345 173 325 172 301"/>
    <path d="M168 301 L170 300 L172 301"/>
  </g>
  <path d="M0 504H340" stroke="#112F4B" stroke-width="2.6" stroke-linecap="round"/>
</svg>
