<path id="right-body-leg" d="M555.8 503.5 C557.8 502.5 555.7 499.2 554 497.5 C547 491 544.6 483 545.8 471 C547 453 551.5 439 552.4 423 C553.7 406 548 390 551.1 373 C555.6 350 557.2 330 556.7 309 C556.8 288 553.8 271 550.2 253 C546.4 234 545.6 218 552.3 200"/>
