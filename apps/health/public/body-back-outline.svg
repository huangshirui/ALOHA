<title id="title">Neutral body map — back view</title>
<desc id="desc">Minimal back-view illustration sharing the front outline proportions: clean nape, two short scapular cues, raised understated gluteal creases and simplified back-of-hand silhouettes. Original path design; no third-party reference was copied.</desc>
<g id="body" fill="none" stroke="#0B2B49" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round">
